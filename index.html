        }

        literaryFilterBtn.addEventListener('click', () => {
            const index = LITERARY_FILTER_MODES.indexOf(literaryFilterMode);
            literaryFilterMode = LITERARY_FILTER_MODES[(index + 1) % LITERARY_FILTER_MODES.length];
            try { localStorage.setItem(LITERARY_FILTER_STORAGE_KEY, literaryFilterMode); } catch (e) { /* ignore */ }
            renderLiteraryFilterUI();
            setupDashboard();
            renderActions();
        });

        (function initLiteraryFilter() {
            try {
                const saved = localStorage.getItem(LITERARY_FILTER_STORAGE_KEY);
                literaryFilterMode = LITERARY_FILTER_MODES.includes(saved) ? saved : 'all';
            } catch (e) {
                literaryFilterMode = 'all';
            }
            renderLiteraryFilterUI();
        })();

        /**
         * Language — same 3-way cycle pattern: All (both languages
         * combined) → French only → English only → back to All.
         */
        const LANGUAGE_FILTER_STORAGE_KEY = 'spiceapp_language_filter_mode_v1';
        const LANGUAGE_FILTER_MODES = ['all', 'fr', 'en'];
        const LANGUAGE_FILTER_LABELS = { all: 'ALL', fr: 'FR', en: 'EN' };
        const LANGUAGE_FILTER_ARIA = {
            all: 'Filtre langue : toutes les langues (français + anglais)',
            fr: 'Filtre langue : textes en français uniquement',
            en: 'Filtre langue : textes en anglais uniquement',
        };

        function renderLanguageFilterUI() {
            const index = LANGUAGE_FILTER_MODES.indexOf(languageFilterMode);
            languageFilterBtn.setAttribute('aria-pressed', languageFilterMode !== 'all' ? 'true' : 'false');
            languageFilterBtn.setAttribute('aria-label', LANGUAGE_FILTER_ARIA[languageFilterMode]);
            languageFilterBtn.classList.toggle('bg-indigo-600', languageFilterMode === 'en');
            languageFilterBtn.classList.toggle('bg-purple-600', languageFilterMode === 'fr');
            languageFilterBtn.classList.toggle('bg-slate-300', languageFilterMode === 'all');
            languageFilterThumb.classList.remove('translate-x-0', 'translate-x-4', 'translate-x-8');
            languageFilterThumb.classList.add(['translate-x-0', 'translate-x-4', 'translate-x-8'][index]);
            languageFilterThumb.textContent = LANGUAGE_FILTER_LABELS[languageFilterMode];
        }

        languageFilterBtn.addEventListener('click', () => {
            const index = LANGUAGE_FILTER_MODES.indexOf(languageFilterMode);
            languageFilterMode = LANGUAGE_FILTER_MODES[(index + 1) % LANGUAGE_FILTER_MODES.length];
            try { localStorage.setItem(LANGUAGE_FILTER_STORAGE_KEY, languageFilterMode); } catch (e) { /* ignore */ }
            renderLanguageFilterUI();
            setupDashboard();
            renderActions();
        });

        (function initLanguageFilter() {
            try {
                const saved = localStorage.getItem(LANGUAGE_FILTER_STORAGE_KEY);
                languageFilterMode = LANGUAGE_FILTER_MODES.includes(saved) ? saved : 'all';
            } catch (e) {
                languageFilterMode = 'all';
            }
            renderLanguageFilterUI();
        })();

        // --- Event Listeners ---
        window.addEventListener('DOMContentLoaded', loadActionsFromServer);
        window.addEventListener('DOMContentLoaded', loadCycleSettings);
        window.addEventListener('DOMContentLoaded', showPendingUpdateDetailsIfAny);
        const dramaFilterValue = document.getElementById('drama-filter-value');
        const sexualFilterValue = document.getElementById('sexual-filter-value');

        statusFilter.addEventListener('change', (e) => { currentFilters.status = e.target.value; renderActions(); });
        dramaFilter.addEventListener('input', (e) => {
            currentFilters.drama = parseInt(e.target.value);
            dramaFilterValue.textContent = currentFilters.drama === 0 ? 'Any' : currentFilters.drama;
            renderActions();
        });
        sexualFilter.addEventListener('input', (e) => {
            currentFilters.sexual = parseInt(e.target.value);
            sexualFilterValue.textContent = currentFilters.sexual === 0 ? 'Any' : currentFilters.sexual;
            renderActions();
        });
        sortBy.addEventListener('change', (e) => { currentSort = e.target.value; renderActions(); });
        const MOOD_LABELS = {
            greeting: '👋 Greeting', how_are_you: '🙂 How are you', miss_you: '💭 Missing you',
            thinking_of_you: '💭 Thinking of you', love_you: '❤️ I love you', thanks: '🙏 Thanks',
            sorry: '😔 Sorry', goodnight: '🌙 Goodnight', good_morning: '☀️ Good morning',
            good_day: '☀️ Have a good day', proud: '✨ Proud of you', well_done: '🎉 Well done',
            good_luck: '🍀 Good luck', take_care: '🤍 Take care', see_you_tonight: '🌆 See you tonight',
            cant_wait: '⏳ Can\'t wait', safe_travels: '🚗 Safe travels', running_late: '⏰ Running late',
            compliment: '😍 Compliment', meet_up: '📅 When are we meeting', rest: '😴 Rest / sleep in',
        };
        function updateMoodSearchHint(query, moodIds) {
            if (!query || moodIds.length === 0) {
                moodSearchHint.classList.add('hidden');
                return;
            }
            const labels = moodIds.map(id => MOOD_LABELS[id] || id).join(', ');
            moodSearchHint.textContent = `✨ Also showing sophisticated alternatives to: ${labels}`;
            moodSearchHint.classList.remove('hidden');
        }
        /**
         * Server-side layer of "smart search" (see server.py's
         * /api/search/smart): a typo-tolerant word search over EVERY
         * card's content, complementing the client-side mood categories
         * above which only cover ~20 hand-curated intents. Debounced
         * (300ms) since it's a network round-trip, not an instant local
         * computation like the rest of the filter pipeline — and guarded
         * against races, since a slow response for an old query could
         * otherwise land after the user has kept typing.
         */
        let smartSearchResults = { query: null, ids: new Set() };
        let smartSearchDebounceTimer = null;
        let smartSearchAbortController = null;

        function scheduleSmartSearch(query) {
            clearTimeout(smartSearchDebounceTimer);
            if (smartSearchAbortController) smartSearchAbortController.abort();
            if (!query || query.length < 3) {
                smartSearchResults = { query, ids: new Set() };
                return;
            }
            smartSearchDebounceTimer = setTimeout(async () => {
                smartSearchAbortController = new AbortController();
                try {
                    const response = await fetch(`/api/search/smart?q=${encodeURIComponent(query)}`, {
                        signal: smartSearchAbortController.signal,
                    });
                    if (!response.ok) return;
                    const data = await response.json();
                    // The user may have kept typing while this was in flight —
                    // a stale result for an old query must never overwrite a
                    // newer (possibly still-empty) one.
                    if (currentFilters.search !== query) return;
                    smartSearchResults = { query, ids: new Set(data.ids || []) };
                    renderActions();
                } catch (e) {
                    // Offline, server briefly restarting, or aborted — smart
                    // search just silently contributes nothing this time;
                    // the substring + mood layers still work unaffected.
                }
            }, 300);
        }

        searchInput.addEventListener('input', (e) => {
            currentFilters.search = e.target.value.trim().toLowerCase();
            updateMoodSearchHint(currentFilters.search, detectMoodCategories(currentFilters.search));
            scheduleSmartSearch(currentFilters.search);
            renderActions();
        });
        resetFiltersBtn.addEventListener('click', resetFilters);
        surpriseBtn.addEventListener('click', surpriseMe);
        updateBtn.addEventListener('click', runUpdate);
        document.querySelectorAll('.category-tab').forEach(btn => {
            btn.addEventListener('click', () => switchCategory(btn.dataset.category));
        });

        // --- Core Functions ---

        /**
         * Switches the active rubrique (ACTIONS / SMS / POSTITS), resetting
         * filters and rebuilding the theme list to only what's relevant for
         * that category.
         */
        function switchCategory(category) {
            if (category === currentCategory) return;
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(btn => {
                const active = btn.dataset.category === category;
                btn.classList.toggle('bg-indigo-950', active);
                btn.classList.toggle('text-white', active);
                btn.classList.toggle('bg-white', !active);
                btn.classList.toggle('text-slate-600', !active);
                btn.classList.toggle('border', !active);
                btn.classList.toggle('border-slate-500', !active);
                btn.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            setupDashboard();
            resetFilters(); // also re-renders via handleThemeFilter('all')
        }

        /**
         * Turns one raw DB row into the shape the rest of the app expects
         * (themes/variations parsed out of their JSON-string columns, isDone
         * coerced to a real boolean).
         */
        function normalizeAction(action) {
            return {
                ...action,
                category: action.category || 'ACTIONS',
                themes: typeof action.themes === 'string' ? JSON.parse(action.themes) : action.themes,
                variations: action.variations
                    ? (typeof action.variations === 'string' ? JSON.parse(action.variations) : action.variations)
                    : [],
                isDone: !!action.isDone
            };
        }

        /**
         * Reads the last locally-cached dataset, if any. Used to paint the
         * dashboard instantly on load while a fresh copy streams in behind
         * it, instead of showing a blank/loading screen every single time.
         */
        function readActionsCache() {
            try {
                const raw = localStorage.getItem(ACTIONS_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.actions) || parsed.actions.length === 0) return null;
                return parsed;
            } catch (e) {
                return null; // corrupt/unavailable cache — just refetch from the server
            }
        }

        /**
         * Writes the current in-memory dataset back to localStorage so the
         * next page load can paint instantly from it. Called after the
         * initial stream finishes and after every local mutation (done
         * toggles), so a refresh never shows stale done-state.
         */
        function persistActionsCache(version) {
            try {
                localStorage.setItem(ACTIONS_CACHE_KEY, JSON.stringify({
                    version: version || (readActionsCache() || {}).version || null,
                    actions: allActions
                }));
            } catch (e) {
                // Storage full/unavailable (private browsing, quota) — caching is
                // purely a perf optimization, so just skip it silently.
            }
        }

        /**
         * Fetches action data from the backend server on page load.
         *
         * Loading strategy, to avoid any blank-screen wait:
         *  1. If a local cache exists, paint it immediately — the dashboard
         *     is interactive before a single network byte comes back.
         *  2. In parallel (or right away if there was no cache), stream the
         *     current data from /api/actions/stream as newline-delimited
         *     JSON, rendering progressively in batches as rows arrive
         *     instead of waiting for the whole ~2000-row payload.
         *  3. Once the stream completes, replace the in-memory dataset with
         *     the fresh one and persist it as the new cache.
         */
        async function loadActionsFromServer() {
            const cached = readActionsCache();
            let paintedFromCache = false;

            if (cached) {
                allActions = cached.actions;
                setupDashboard();
                renderActions();
                loadingSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                paintedFromCache = true;
            }

            try {
                if (!paintedFromCache) {
                    loadingSection.classList.remove('hidden');
                    dashboardSection.classList.add('hidden');
                }

                const headers = cached && cached.version ? { 'If-None-Match': cached.version } : {};
                const response = await fetch('/api/actions/stream', { headers });

                if (response.status === 304) {
                    // Cache already matches what's on the server — nothing to do.
                    return;
                }
                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const version = response.headers.get('X-Actions-Version');
                const streamed = [];

                if (response.body && response.body.getReader) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let sinceLastRender = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        let newlineIndex;
                        while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
                            const line = buffer.slice(0, newlineIndex);
                            buffer = buffer.slice(newlineIndex + 1);
                            if (!line) continue;
                            streamed.push(normalizeAction(JSON.parse(line)));
                            sinceLastRender++;
                        }
                        // Render progressively so the very first cards show up
                        // long before all ~2000 rows have arrived, instead of
                        // one big render at the very end.
                        if (sinceLastRender >= 150 && !paintedFromCache) {
                            allActions = streamed.slice();
                            setupDashboard();
                            renderActions();
                            loadingSection.classList.add('hidden');
                            dashboardSection.classList.remove('hidden');
                            paintedFromCache = true; // now painted, from live data
                            sinceLastRender = 0;
                        }
                    }
                    if (buffer.trim()) {
                        streamed.push(normalizeAction(JSON.parse(buffer)));
                    }
                } else {
                    // Old browser without a readable stream API — fall back to
                    // a single JSON fetch of the whole dataset.
                    const data = await (await fetch('/api/actions')).json();
                    streamed.push(...data.map(normalizeAction));
                }

                if (streamed.length === 0) {
                    throw new Error("No actions found in the database.");
                }

                allActions = streamed;
                setupDashboard();
                renderActions();
                persistActionsCache(version);

            } catch (error) {
                console.error("Error loading actions:", error);
                if (!paintedFromCache) {
                    loadingMessage.innerHTML = `<p class="text-red-500">An error occurred: ${error.message}</p><p class="text-slate-500 mt-2">Please ensure the backend server is running and the database has been set up correctly.</p>`;
                }
            } finally {
                loadingSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            }
        }
        
        /**
         * Cards currently in scope for the main switches — category, the
         * literary filter, the language filter and (when enabled) the active
         * cycle phase — but NOT the theme filter itself, the search box, the
         * status dropdown or the drama/sexual sliders. Used to compute which
         * theme tags are actually worth offering: a tag with zero matching
         * cards under the switches currently on shouldn't be clickable, but
         * the list also shouldn't jump around on every keystroke in search
         * or every drag of a slider.
         */
        function getSwitchScopedActions() {
            let scoped = allActions.filter(a => a.category === currentCategory);
            if (literaryFilterMode !== 'all') {
                const isLiterary = a => a.themes.includes('Literary') || a.themes.includes('Littéraire');
                scoped = literaryFilterMode === 'literary' ? scoped.filter(isLiterary) : scoped.filter(a => !isLiterary(a));
            }
            if (languageFilterMode !== 'all') {
                scoped = scoped.filter(a => detectCardLanguage(a) === languageFilterMode);
            }
            if (cycleSettings.cycleEnabled && cycleSettings.lastPeriodDate) {
                const activePhases = getActivePhases(getCycleDay(cycleSettings.lastPeriodDate));
                scoped = scoped.filter(a => cardMatchesActivePhases(a, activePhases));
            }
            return scoped;
        }

        /**
         * Sets up the dashboard UI elements like theme filters. Themes are
         * split into an EN and a FR set (per detectCardLanguage) and which
         * set(s) render follows the current language switch (languageFilterMode),
         * so the list never shows themes that don't even apply to what's
         * currently visible — nor tags with zero matching cards under
         * whichever other switches (literary, cycle) are also active.
         */
        function setupDashboard() {
            const themesEN = new Set();
            const themesFR = new Set();
            getSwitchScopedActions().forEach(a => {
                const bucket = detectCardLanguage(a) === 'fr' ? themesFR : themesEN;
                a.themes.forEach(theme => bucket.add(theme));
            });

            // The previously selected theme may not exist in the language
            // scope we're about to render (or in the new category) — fall
            // back to 'all' rather than silently filtering to nothing.
            // Resolved before building the buttons below so the correct one
            // ends up marked active on this same pass.
            const availableThemes = languageFilterMode === 'en' ? themesEN
                : languageFilterMode === 'fr' ? themesFR
                : new Set([...themesEN, ...themesFR]);
            if (currentFilters.theme !== 'all' && !availableThemes.has(currentFilters.theme)) {
                currentFilters.theme = 'all';
            }

            const isActive = (theme) => currentFilters.theme === theme;
            const themeBtnClass = (active) => `theme-btn px-4 py-1.5 text-sm font-medium rounded-full ${active ? 'active bg-indigo-600 text-white' : 'bg-white text-slate-700 border border-slate-500 hover:bg-slate-100 hover:text-slate-900'}`;
            const themeBtn = (theme) => `<button onclick="handleThemeFilter('${theme}')" class="${themeBtnClass(isActive(theme))}">${theme}</button>`;
            const langHeader = (label) => `<span class="w-full text-xs font-semibold text-slate-400 uppercase tracking-wide mt-2 first:mt-0">${label}</span>`;

            const parts = [`<button onclick="handleThemeFilter('all')" class="${themeBtnClass(isActive('all'))}">All Themes</button>`];
            if (languageFilterMode === 'en') {
                [...themesEN].sort().forEach(theme => parts.push(themeBtn(theme)));
            } else if (languageFilterMode === 'fr') {
                [...themesFR].sort().forEach(theme => parts.push(themeBtn(theme)));
            } else {
                if (themesEN.size) {
                    parts.push(langHeader('EN'));
                    [...themesEN].sort().forEach(theme => parts.push(themeBtn(theme)));
                }
                if (themesFR.size) {
                    parts.push(langHeader('FR'));
                    [...themesFR].sort().forEach(theme => parts.push(themeBtn(theme)));
                }
            }
            themeFilters.innerHTML = parts.join('');
        }
        
        window.handleThemeFilter = (theme) => {
            currentFilters.theme = theme;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                const btnTheme = btn.textContent;
                if (btnTheme === theme || (theme === 'all' && btnTheme === 'All Themes')) {
                    btn.classList.add('active', 'bg-indigo-600', 'text-white');
                    btn.classList.remove('bg-white', 'text-slate-700', 'border', 'border-slate-500');
                } else {
                    btn.classList.remove('active', 'bg-indigo-600', 'text-white');
                    btn.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-500');
                }
            });
            renderActions();
        }
        
        /**
         * Renders the action cards based on current filters and sorting.
         */
        // How many cards get built/inserted into the DOM at a time. Building
        // the full innerHTML for a whole category (up to ~1200+ cards) in one
        // go is what caused the lag switching categories or toggling cycle
        // mode, especially on phones — instead only this many render up
        // front, and the rest load in as the user scrolls near the bottom
        // (same idea as an Instagram-style feed), via the IntersectionObserver
        // sentinel set up in setupLoadMoreSentinelIfNeeded().
        const RENDER_BATCH_SIZE = 30;
        let renderedFilteredActions = [];
        let renderedCount = 0;
        let loadMoreObserver = null;

        /**
         * Renders the action cards based on current filters and sorting.
         * `resetPagination` (default true) starts over from the first batch —
         * pass false to keep whatever's already loaded (used by the done/
         * variation toggle handlers, so ticking a checkbox doesn't collapse
         * cards the user already scrolled past back down to just batch one).
         */
        function renderActions(resetPagination = true) {
            let filteredActions = allActions.filter(a => a.category === currentCategory);

            // Apply filters
            if (currentFilters.status === 'done') filteredActions = filteredActions.filter(isGroupFullyDone);
            else if (currentFilters.status === 'new') filteredActions = filteredActions.filter(a => !isGroupFullyDone(a));
            if (currentFilters.drama > 0) filteredActions = filteredActions.filter(a => a.dramaIntensity === currentFilters.drama);
            if (currentFilters.sexual > 0) filteredActions = filteredActions.filter(a => a.sexualIntensity === currentFilters.sexual);
            if (currentFilters.theme !== 'all') filteredActions = filteredActions.filter(a => a.themes.includes(currentFilters.theme));
            if (literaryFilterMode !== 'all') {
                const isLiterary = a => a.themes.includes('Literary') || a.themes.includes('Littéraire');
                filteredActions = literaryFilterMode === 'literary'
                    ? filteredActions.filter(isLiterary)
                    : filteredActions.filter(a => !isLiterary(a));
            }
            if (languageFilterMode !== 'all') {
                filteredActions = filteredActions.filter(a => detectCardLanguage(a) === languageFilterMode);
            }
            let activePhaseLabel = null;
            if (cycleSettings.cycleEnabled && cycleSettings.lastPeriodDate) {
                const activePhases = getActivePhases(getCycleDay(cycleSettings.lastPeriodDate));
                activePhaseLabel = activePhases.map(p => p.label).join(' → ');
                filteredActions = filteredActions.filter(a => cardMatchesActivePhases(a, activePhases));
            }
            if (currentFilters.search) {
                const q = currentFilters.search;
                const moodIds = detectMoodCategories(q);
                const smartIds = smartSearchResults.query === q ? smartSearchResults.ids : null;
                filteredActions = filteredActions.filter(a =>
                    a.actionTitle.toLowerCase().includes(q) || a.text.toLowerCase().includes(q) ||
                    moodIds.some(id => cardMatchesMoodCategory(a, id)) ||
                    (smartIds !== null && smartIds.has(a.id))
                );
            }

            // Apply sorting
            switch (currentSort) {
                case 'drama-asc': filteredActions.sort((a, b) => a.dramaIntensity - b.dramaIntensity); break;
                case 'drama-desc': filteredActions.sort((a, b) => b.dramaIntensity - a.dramaIntensity); break;
                case 'sexual-asc': filteredActions.sort((a, b) => a.sexualIntensity - b.sexualIntensity); break;
                case 'sexual-desc': filteredActions.sort((a, b) => b.sexualIntensity - a.sexualIntensity); break;
                default: filteredActions.sort((a, b) => a.id - b.id);
            }

            renderedFilteredActions = filteredActions;
            if (resetPagination) {
                paintFreshBatch();
            } else {
                // Keep whatever was already on screen (clamped: a toggle can
                // shrink the set under a status filter of "new"/"done").
                renderedCount = Math.min(Math.max(renderedCount, RENDER_BATCH_SIZE), filteredActions.length);
                repaintLoadedSlice();
            }

            const categoryTotal = allActions.filter(a => a.category === currentCategory).length;
            const categoryLabels = { ACTIONS: 'actions', SMS: 'SMS', POSTITS: 'post-its' };
            const phaseSuffix = activePhaseLabel ? ` — période : ${activePhaseLabel}` : '';
            actionsCount.textContent = `Showing ${filteredActions.length} of ${categoryTotal} ${categoryLabels[currentCategory] || 'items'}.${phaseSuffix}`;
            updateProgress();
        }

        function noResultsHtml() {
            return `<div class="md:col-span-2 xl:col-span-3 text-center py-12 bg-white rounded-lg shadow-sm border">
                <h3 class="text-xl font-semibold text-slate-700">No actions match your filters.</h3>
                <p class="text-slate-500 mt-2">Try adjusting your filter settings.</p>
            </div>`;
        }

        function clearLoadMoreSentinel() {
            if (loadMoreObserver) {
                loadMoreObserver.disconnect();
                loadMoreObserver = null;
            }
            const existing = document.getElementById('load-more-sentinel');
            if (existing) existing.remove();
        }

        /** Full repaint starting at batch one — used on category/filter/search/cycle changes. */
        function paintFreshBatch() {
            clearLoadMoreSentinel();
            if (renderedFilteredActions.length === 0) {
                actionsList.innerHTML = noResultsHtml();
                renderedCount = 0;
                applyIndeterminateStates();
                return;
            }
            const firstBatch = renderedFilteredActions.slice(0, RENDER_BATCH_SIZE);
            actionsList.innerHTML = firstBatch.map(createActionCard).join('');
            renderedCount = firstBatch.length;
            applyIndeterminateStates();
            setupLoadMoreSentinelIfNeeded();
        }

        /** Repaints exactly the slice already loaded (0..renderedCount) — used after a done/variation toggle. */
        function repaintLoadedSlice() {
            clearLoadMoreSentinel();
            if (renderedFilteredActions.length === 0) {
                actionsList.innerHTML = noResultsHtml();
                renderedCount = 0;
                applyIndeterminateStates();
                return;
            }
            const slice = renderedFilteredActions.slice(0, renderedCount);
            actionsList.innerHTML = slice.map(createActionCard).join('');
            applyIndeterminateStates();
            setupLoadMoreSentinelIfNeeded();
        }

        /** Appends the next batch to the DOM (not a full rebuild) once the sentinel scrolls into view. */
        function loadMoreAppend() {
            clearLoadMoreSentinel();
            const nextSlice = renderedFilteredActions.slice(renderedCount, renderedCount + RENDER_BATCH_SIZE);
            actionsList.insertAdjacentHTML('beforeend', nextSlice.map(createActionCard).join(''));
            renderedCount += nextSlice.length;
            applyIndeterminateStates();
            setupLoadMoreSentinelIfNeeded();
        }

        function setupLoadMoreSentinelIfNeeded() {
            if (renderedCount >= renderedFilteredActions.length) return;
            const sentinel = document.createElement('div');
            sentinel.id = 'load-more-sentinel';
            sentinel.className = 'md:col-span-2 xl:col-span-3 py-6 text-center text-slate-400 text-sm';
            sentinel.textContent = 'Chargement…';
            actionsList.appendChild(sentinel);
            // rootMargin loads the next batch a bit before the sentinel is
            // actually on screen, so scrolling never visibly outruns it.
            loadMoreObserver = new IntersectionObserver((entries) => {
                if (entries.some(entry => entry.isIntersecting)) loadMoreAppend();
            }, { rootMargin: '800px 0px' });
            loadMoreObserver.observe(sentinel);
        }

        /**
         * An action "group" is the original text plus its optional
         * variations — different phrasings of the same idea. Group
         * completion is how many of those options have been marked done,
         * which is what the card-level "Done" checkbox now reflects
         * (instead of only the original text's own isDone).
         */
        function getGroupCounts(action) {
            const variations = action.variations || [];
            const total = 1 + variations.length;
            const done = (action.isDone ? 1 : 0) + variations.filter(v => v.isDone).length;
            return { total, done };
        }

        function isGroupFullyDone(action) {
            const { total, done } = getGroupCounts(action);
            return done === total;
        }

        /**
         * Applies the native `indeterminate` checkbox state to any rendered
         * "Done" checkbox marked with data-indeterminate — this can only be
         * set via JS (there is no HTML attribute for it), so it has to run
         * after every innerHTML rebuild.
         */
        function applyIndeterminateStates() {
            document.querySelectorAll('.done-checkbox[data-indeterminate="true"]').forEach(cb => {
                cb.indeterminate = true;
            });
        }

        /**
         * Updates the "done" progress bar, scoped to the current rubrique
         * (ACTIONS / SMS / POSTITS) rather than across all of them.
         */
        function updateProgress() {
            const inCategory = allActions.filter(a => a.category === currentCategory);
            const total = inCategory.length;
            const done = inCategory.filter(isGroupFullyDone).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            progressLabel.textContent = `${done} / ${total} done`;
            progressPercent.textContent = `${percent}%`;
            progressBar.style.width = `${percent}%`;
        }

        /**
         * Resets all filters, sorting and the search box to their defaults.
         */
        function resetFilters() {
            currentFilters = { status: 'all', drama: 0, sexual: 0, theme: 'all', search: '' };
            currentSort = 'default';
            statusFilter.value = 'all';
            dramaFilter.value = '0';
            sexualFilter.value = '0';
            dramaFilterValue.textContent = 'Any';
            sexualFilterValue.textContent = 'Any';
            sortBy.value = 'default';
            searchInput.value = '';
            updateMoodSearchHint('', []);
            scheduleSmartSearch('');
            handleThemeFilter('all');
        }

        /**
         * Picks a random not-yet-done action (matching current filters if any are active)
         * and opens its details modal. Falls back to any action if everything is done.
         */
        function surpriseMe() {
            const inCategory = allActions.filter(a => a.category === currentCategory);
            const pool = inCategory.filter(a => !isGroupFullyDone(a));
            const candidates = pool.length > 0 ? pool : inCategory;
            if (candidates.length === 0) return;
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            showDetails(pick.id);
        }

        function showUpdateToast(message) {
            updateToast.textContent = message;
            updateToast.classList.remove('hidden');
        }

        /**
         * Loader variant of the toast: a numeric "current/total" counter plus
         * a thin progress bar, updated once per file as the update downloads
         * each changed file individually (see runUpdate()).
         */
        function showUpdateProgress(current, total, label) {
            const pct = total > 0 ? Math.round((current / total) * 100) : 0;
            updateToast.innerHTML = `
                <div class="flex flex-col gap-1.5 min-w-[180px]">
                    <span>${escapeHtml(label)} (${current}/${total})</span>
                    <div class="w-full h-1.5 bg-slate-600 rounded-full overflow-hidden">
                        <div class="h-full bg-white rounded-full transition-all duration-300" style="width:${pct}%"></div>
                    </div>
                </div>`;
            updateToast.classList.remove('hidden');
        }

        /**
         * Same loader chrome as showUpdateProgress(), but for the /api/update/check
         * phase where the file count (and so a real percentage) isn't known yet —
         * a sweeping indeterminate bar instead of a static filled one, so the
         * loader looks continuous from the very first click instead of jumping
         * from plain text to a bar once the count arrives.
         */
        function showUpdateChecking(label) {
            updateToast.innerHTML = `
                <div class="flex flex-col gap-1.5 min-w-[180px]">
                    <span>${escapeHtml(label)}</span>
                    <div class="w-full h-1.5 bg-slate-600 rounded-full overflow-hidden">
                        <div class="update-indeterminate-bar h-full bg-white rounded-full"></div>
                    </div>
                </div>`;
            updateToast.classList.remove('hidden');
        }

        function hideUpdateToast() {
            updateToast.classList.add('hidden');
        }

        const UPDATE_FILE_LABELS = {
            'server.py': 'Backend serveur (Flask)',
            'index.html': 'Interface (page principale)',
            'setup_database.py': 'Script de génération de la base de données',
            'database.db': 'Base de données (contenu des cartes)',
            'sms_cards.json': 'Cartes SMS',
            'postit_cards.json': 'Cartes Post-its',
            'new_cards.json': 'Cartes Actions',
            'enrichment_data.json': "Données d'enrichissement",
            'requirements.txt': 'Dépendances Python',
        };
        const UPDATE_PENDING_KEY = 'spiceapp_pending_update_details';

        /**
         * Renders the "what changed" popup from an /api/update result (or a
         * copy of one restored from sessionStorage after a post-update reload).
         */
        function showUpdateDetails(result) {
            const commits = result.commits || [];

            // The real changelog: each commit's own message (title + body),
            // which is where the human-readable "what changed" actually
            // lives — "ajout de 50 cartes dans Actions", "correction du bug
            // X", etc. — rather than a bare list of touched filenames.
            const changelogItems = commits.map(c => `
                <li class="py-2">
                    <p class="font-medium text-slate-800">${escapeHtml(c.subject)}</p>
                    ${c.body ? `<p class="text-sm text-slate-500 whitespace-pre-line mt-0.5">${escapeHtml(c.body)}</p>` : ''}
                </li>`).join('');
            const changelogBlock = commits.length > 0
                ? `<p class="text-sm text-slate-500 mb-1">Ce qui a changé :</p>
                   <ul class="divide-y divide-slate-100 mb-3">${changelogItems}</ul>`
                : `<p class="text-sm text-slate-500 mb-3">Première synchronisation : l'historique détaillé des changements sera disponible à partir de la prochaine mise à jour.</p>`;

            // Raw file list kept as secondary/technical detail underneath.
            const fileItems = result.updated.map(path => {
                const label = UPDATE_FILE_LABELS[path] || path;
                return `<li class="flex items-start gap-2.5 py-1.5">
                    <span class="text-green-500 mt-0.5">✓</span>
                    <span><span class="font-medium text-slate-800">${escapeHtml(label)}</span>
                        <span class="block text-xs text-slate-400">${escapeHtml(path)}</span></span>
                </li>`;
            }).join('');
            const restartNote = result.restarting
                ? `<p class="text-sm text-slate-500 mt-3 pt-3 border-t border-slate-200">Le serveur a redémarré pour appliquer le nouveau code.</p>`
                : '';

            updateDetailsContent.innerHTML = `
                ${changelogBlock}
                <details class="pt-2 border-t border-slate-200">
                    <summary class="text-sm font-medium text-slate-600 cursor-pointer select-none">${result.updated.length} fichier(s) mis à jour</summary>
                    <ul class="divide-y divide-slate-100 mt-2">${fileItems}</ul>
                </details>
                ${restartNote}
            `;
            updateDetailsModal.classList.remove('hidden');
        }

        function hideUpdateDetails() {
            updateDetailsModal.classList.add('hidden');
        }

        /**
         * On page load, checks whether an update was just applied (stashed
         * in sessionStorage right before the pre-reload navigation, since a
         * backend update tears down and reloads the page entirely) and, if
         * so, shows the details popup once and clears the flag.
         */
        function showPendingUpdateDetailsIfAny() {
            let raw = null;
            try { raw = sessionStorage.getItem(UPDATE_PENDING_KEY); } catch (e) { return; }
            if (!raw) return;
            try { sessionStorage.removeItem(UPDATE_PENDING_KEY); } catch (e) { /* ignore */ }
            try {
                showUpdateDetails(JSON.parse(raw));
            } catch (e) { /* corrupted/old value — ignore */ }
        }

        /**
         * Downloads and applies any files changed on GitHub since this copy
         * was last updated, one file at a time (each call drives the numeric
         * progress loader). If a .py file was among them, the server restarts
         * itself afterwards — this then polls until it's back up and reloads
         * the page so the browser picks up the new frontend/backend together.
         * Either way, once files were actually updated, a popup details what
         * changed (persisted across the reload via sessionStorage).
         */
        // The backend already retries a single download a few times and
        // enforces its own wall-clock deadline (server.py's DOWNLOAD_TIMEOUT
        // / DOWNLOAD_RETRIES), so a 504 from it means that already failed —
        // no point retrying here too. This client-side retry instead covers
        // the layer the backend can't: the request never reaching it at all
        // (a dropped mobile connection, a stalled local socket) or coming
        // back so slowly the browser itself should give up and try again
        // fresh rather than keep waiting on a spinner that looks frozen.
        const UPDATE_FILE_FETCH_TIMEOUT = 35000;
        const UPDATE_FILE_RETRIES = 3;
        const UPDATE_FILE_RETRY_DELAY = 1500;

        async function fetchUpdateFileOnce(path) {
            const controller = new AbortController();
            const abortTimer = setTimeout(() => controller.abort(), UPDATE_FILE_FETCH_TIMEOUT);
            let response;
            try {
                response = await fetch('/api/update/file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path }),
                    signal: controller.signal,
                });
            } catch (e) {
                if (e.name === 'AbortError') throw new Error(`'${path}' download timed out — connection is too slow or was interrupted.`);
                throw e;
            } finally {
                clearTimeout(abortTimer);
            }
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || `Failed to update ${path}.`);
            return result;
        }

        async function fetchUpdateFileWithRetry(path) {
            let lastError;
            for (let attempt = 0; attempt < UPDATE_FILE_RETRIES; attempt++) {
                try {
                    return await fetchUpdateFileOnce(path);
                } catch (e) {
                    lastError = e;
                    if (attempt < UPDATE_FILE_RETRIES - 1) {
                        await new Promise(r => setTimeout(r, UPDATE_FILE_RETRY_DELAY));
                    }
                }
            }
            throw lastError;
        }

        async function runUpdate() {
            updateBtn.disabled = true;
            showUpdateChecking('Checking for updates…');
            try {
                // The backend's own GitHub calls already time out well under
                // this, but this guards against the backend itself being
                // unreachable (e.g. no network at all) instead of the
                // request just sitting forever with no feedback.
                const controller = new AbortController();
                const abortTimer = setTimeout(() => controller.abort(), 20000);
                let checkResponse;
                try {
                    checkResponse = await fetch('/api/update/check', { cache: 'no-store', signal: controller.signal });
                } catch (e) {
                    if (e.name === 'AbortError') throw new Error('Update check timed out — check your connection.');
                    throw e;
                } finally {
                    clearTimeout(abortTimer);
                }
                const checkResult = await checkResponse.json();
                if (!checkResponse.ok) throw new Error(checkResult.error || 'Update check failed.');

                const files = checkResult.files || [];
                if (files.length === 0) {
                    showUpdateToast('Already up to date.');
                    setTimeout(hideUpdateToast, 2500);
                    updateBtn.disabled = false;
                    return;
                }

                const total = files.length;
                showUpdateProgress(0, total, 'Downloading updates');
                for (let i = 0; i < total; i++) {
                    const label = UPDATE_FILE_LABELS[files[i]] || files[i];
                    showUpdateProgress(i, total, `Downloading — ${label}`);
                    await fetchUpdateFileWithRetry(files[i]);
                    showUpdateProgress(i + 1, total, 'Downloading updates');
                }

                // Every file from this batch is now on disk — record the
                // commit SHA we've synced to, so the *next* check's changelog
                // starts from here instead of re-listing commits just applied.
                if (checkResult.headSha) {
                    try {
                        await fetch('/api/update/mark-applied', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ headSha: checkResult.headSha }),
                        });
                    } catch (e) { /* non-fatal — worst case the changelog re-lists these commits next time */ }
                }

                const restarting = files.some(f => f.endsWith('.py'));
                const summary = { updated: files, restarting, commits: checkResult.commits || [] };

                // The page is about to reload (immediately, or after the
                // server restart below) — stash the result so the details
                // popup can be shown again once the fresh page loads.
                try { sessionStorage.setItem(UPDATE_PENDING_KEY, JSON.stringify(summary)); } catch (e) { /* storage unavailable — popup just won't reappear */ }

                if (restarting) {
                    showUpdateToast(`Updated ${total} file(s). Restarting server…`);
                    await fetch('/api/update/restart', { method: 'POST' });
                    const backOnline = await waitForServerRestart();
                    if (backOnline) {
                        showUpdateToast('Back online — reloading…');
                        setTimeout(() => window.location.reload(), 400);
                    } else {
                        // The server never answered again — reloading now
                        // would just hang on a dead connection with no
                        // feedback (the exact "stuck on Reloading…" bug).
                        // The files are already on disk either way, so tell
                        // the user to relaunch instead of pretending it worked.
                        try { sessionStorage.removeItem(UPDATE_PENDING_KEY); } catch (e) { /* ignore */ }
                        showUpdateToast('Mise à jour installée, mais le serveur ne redémarre pas tout seul — ferme puis relance l\'application.');
                        setTimeout(hideUpdateToast, 8000);
                        updateBtn.disabled = false;
                    }
                } else {
                    showUpdateToast(`Updated ${total} file(s). Reloading…`);
                    setTimeout(() => window.location.reload(), 800);
                }
            } catch (error) {
                console.error('Update failed:', error);
                showUpdateToast(`Update failed: ${error.message}`);
                setTimeout(hideUpdateToast, 4000);
                updateBtn.disabled = false;
            }
        }

        /**
         * Polls the server every second until it responds again (it goes
         * down briefly while re-executing itself after a backend update).
         */
        async function waitForServerRestart() {
            // Give the server a moment to actually start shutting down before
            // we start expecting connection failures to mean "still restarting".
            await new Promise(r => setTimeout(r, 1200));
            for (let attempt = 0; attempt < 30; attempt++) {
                try {
                    const response = await fetch('/api/actions', { cache: 'no-store' });
                    if (response.ok) return true;
                } catch (e) {
                    // Server is down mid-restart — expected, keep polling.
                }
                await new Promise(r => setTimeout(r, 1000));
            }
            // ~31s without a response — the process likely never came back
            // (e.g. killed outright rather than cleanly restarting, which
            // happens on some mobile setups like Termux when the OS
            // suspends/kills the background process). Let the caller decide
            // what to tell the user instead of assuming success.
            return false;
        }

        /**

            const flameSVG = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C12 2 4 8.41828 4 14.4C4 18.0327 6.68629 21 10 21C12.2343 21 14.5348 20.007 15.9015 18.5M12 2C12 2 20 8.41828 20 14.4C20 18.0327 17.3137 21 14 21C11.7657 21 9.46519 20.007 8.09852 18.5M12 2V22"></path><path d="M12 6C12.9272 6 14.3197 6.46387 15 7.5C15.6803 8.53613 16 10.3648 16 12C16 15.3137 12 18 12 18C12 18 8 15.3137 8 12C8 10.3648 8.3197 8.53613 9 7.5C9.68031 6.46387 11.0728 6 12 6Z"></path></svg>`;

            const groupCounts = getGroupCounts(action);
            const hasVariations = action.variations && action.variations.length > 0;
            const fullyDone = groupCounts.done === groupCounts.total;

                                </svg>
                            </button>
                            <div class="flex items-center">
                                <input type="checkbox" id="done-${action.id}" class="done-checkbox absolute opacity-0 w-0 h-0" onchange="${checkboxOnChange}" ${fullyDone ? 'checked' : ''} ${partiallyDone ? 'data-indeterminate="true"' : ''}>

                    <div class="mb-5 sm:mb-6">

                        <h4 class="text-base sm:text-lg font-semibold text-indigo-700 mb-1.5 sm:mb-2">${action.actionTitle}</h4>

                    <div class="flex items-center justify-between"><span class="text-sm font-medium text-slate-500">Sexual Intensity:</span><div class="flex items-center gap-1">${sexualFlames}</div></div>

        /**
         * Toggles the 'done' status of an action and saves to the database.
         */
        async function toggleDone(actionId) {
            try {
                const response = await fetch(`/api/actions/${actionId}/toggle`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error('Failed to update action status on the server.');
                }
                const updatedAction = await response.json();
                
                // Find and update the action in our local state
                const actionIndex = allActions.findIndex(a => a.id === actionId);
                if (actionIndex !== -1) {
                    allActions[actionIndex].isDone = !!updatedAction.isDone;
                }

                // Re-render the view to reflect the change (without resetting
                // pagination back to batch one — see renderActions() doc).
                renderActions(false);
                persistActionsCache();
                if (!modal.classList.contains('hidden') && currentModalActionId === actionId) {
                    showDetails(actionId);
                }

            } catch (error) {
                console.error("Error toggling done status:", error);
                alert("Could not update the action. Please check your connection and try again.");
            }
        }

        /**
         * Card-level "Done" checkbox for an action that has variations:
         * marks the whole group (original text + every variation) done or
         * not-done together, so the card checkbox always reflects true
         * group completion rather than just the original text's state.
         * Open the details modal to toggle individual variations instead.
         */
        async function toggleGroupDone(actionId) {
            const action = allActions.find(a => a.id === actionId);
            if (!action) return;
            const targetState = !isGroupFullyDone(action);

            try {
                // Sequential, not Promise.all: the variations toggle endpoint
                // does a read-modify-write on the whole `variations` JSON
                // column, so firing several of those at once for the same
                // action is a lost-update race (confirmed while testing this
                // feature — the last response to land silently discards
                // whichever other variation was toggled concurrently).
                if (action.isDone !== targetState) {
                    await fetch(`/api/actions/${actionId}/toggle`, { method: 'POST' });
                }
                for (let i = 0; i < action.variations.length; i++) {
                    if (action.variations[i].isDone !== targetState) {
                        await fetch(`/api/actions/${actionId}/variations/${i}/toggle`, { method: 'POST' });
                    }
                }

                action.isDone = targetState;
                action.variations = action.variations.map(v => ({ ...v, isDone: targetState }));

                renderActions(false);
                persistActionsCache();
                if (!modal.classList.contains('hidden') && currentModalActionId === actionId) {
                    showDetails(actionId);
                }
            } catch (error) {
                console.error("Error toggling group status:", error);
                alert("Could not update this action. Please check your connection and try again.");
            }
        }

        /**
         * Toggles the 'done' status of one example variation within an
         * action's details modal, and saves it to the database.
         */
        async function toggleVariationDone(actionId, variationIndex) {
            try {
                const response = await fetch(`/api/actions/${actionId}/variations/${variationIndex}/toggle`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error('Failed to update variation status on the server.');
                }
                const updatedAction = await response.json();
                const variations = JSON.parse(updatedAction.variations || '[]');

                const action = allActions.find(a => a.id === actionId);
                if (action) {
                    action.variations = variations;
                }

                // Re-render the card list too: the card's "Done" badge/state
                // for this action is derived from the whole group (original
                // + variations), so a variation toggle can change it.
                renderActions(false);
                persistActionsCache();
                if (!modal.classList.contains('hidden') && currentModalActionId === actionId) {
                    showDetails(actionId);
                }
            } catch (error) {
                console.error("Error toggling variation status:", error);
                alert("Could not update the variation. Please check your connection and try again.");
            }
        }

        function toggleThemeFilterVisibility() {
            const panel = document.getElementById('theme-filters');
            const nowHidden = panel.classList.toggle('hidden');
            document.getElementById('theme-toggle-icon').classList.toggle('rotate-180');
            document.querySelector('[aria-controls="theme-filters"]').setAttribute('aria-expanded', nowHidden ? 'false' : 'true');
        }

        /**
         * Filters & Sorting panel is foldable: on phone screens it defaults
         * to collapsed (it otherwise covers most of the viewport above the
         * card list), and stays expanded by default on larger screens. The
         * user's last choice is remembered per-device (localStorage) so it
         * doesn't reset every time they reopen the app.
         */
        const FILTERS_COLLAPSE_STORAGE_KEY = 'filtersPanelCollapsed';
        const MOBILE_BREAKPOINT_QUERY = '(max-width: 767px)';

        function setFiltersVisibility(collapsed) {
            document.getElementById('filters-body').classList.toggle('hidden', collapsed);
            document.getElementById('filters-toggle-icon').classList.toggle('rotate-180', collapsed);
            document.getElementById('filters-toggle-btn').setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        }

        window.toggleFiltersVisibility = () => {
            const nowCollapsed = !document.getElementById('filters-body').classList.contains('hidden');
            setFiltersVisibility(nowCollapsed);
            localStorage.setItem(FILTERS_COLLAPSE_STORAGE_KEY, nowCollapsed ? '1' : '0');
        };

        (function initFiltersVisibility() {
            let collapsed;
            try {
                const saved = localStorage.getItem(FILTERS_COLLAPSE_STORAGE_KEY);
                collapsed = saved !== null ? saved === '1' : window.matchMedia(MOBILE_BREAKPOINT_QUERY).matches;
            } catch (e) {
                // localStorage unavailable (private browsing, etc.) — fall back to viewport width only.
                collapsed = window.matchMedia(MOBILE_BREAKPOINT_QUERY).matches;
            }
            setFiltersVisibility(collapsed);
        })();

        /**
         * Shows the details modal with content from the selected action.
         */
        function showDetails(actionId) {
            const action = allActions.find(a => a.id === actionId);
            if (!action) return;
            currentModalActionId = actionId;

            // The modal deliberately mirrors the card (same title, same text,
            // same "why it works") instead of dumping the raw source section,
            // which used to bundle in other, unrelated actions. The only
            // thing it adds is the shared context: which section this came
            // from, and the predictable habit it's meant to replace.
            modalTitle.textContent = action.actionTitle;
            modalSection.textContent = action.sectionTitle || '';
            if (action.sourceWork) {
                modalSourceWork.textContent = `📖 ${action.sourceWork}${action.sourceWorkAuthor ? ` — ${action.sourceWorkAuthor}` : ''}`;
                modalSourceWork.classList.remove('hidden');
            } else {
                modalSourceWork.classList.add('hidden');
            }

            const doneCheckbox = (id, checked, onchange, label = 'Done') => `
                <label class="inline-flex items-center gap-1.5 cursor-pointer select-none shrink-0">
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="${onchange}"
                        class="w-4 h-4 rounded border-slate-500 text-green-600 focus:ring-2 focus:ring-green-600">
                    <span class="text-xs font-medium text-slate-500">${label}</span>
                </label>`;

            let html = '';
            if (action.variations && action.variations.length > 0) {
                const groupCounts = getGroupCounts(action);
                const pct = Math.round((groupCounts.done / groupCounts.total) * 100);
                html += `
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <div class="flex items-center justify-between text-sm font-medium text-slate-600 mb-2">
                        <span>Options essayées pour cette action</span>
                        <span class="text-slate-800 font-semibold">${groupCounts.done} / ${groupCounts.total}</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div class="bg-gradient-to-r from-pink-400 to-indigo-500 h-2 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                    </div>
                </div>`;
            }
            if (action.predictable) {
                html += `
                <div>
                    <h5 class="font-semibold text-slate-500 text-sm uppercase tracking-wide mb-1">Au lieu du prévisible</h5>
                    <p class="text-slate-600">${escapeHtml(action.predictable)}</p>
                </div>`;
            }
            html += `
                <div>
                    <div class="flex items-start justify-between gap-3 mb-1">
                        <h5 class="font-semibold text-indigo-600 text-sm uppercase tracking-wide">L'action</h5>
                        ${doneCheckbox(action.id, action.isDone, `toggleDone(${action.id})`)}
                    </div>
                    <p class="text-slate-800 leading-relaxed whitespace-pre-line ${action.isDone ? 'line-through text-slate-400' : ''}">${escapeHtml(action.text)}</p>
                </div>`;
            if (action.effect) {
                html += `
                <div>
                    <h5 class="font-semibold text-purple-600 text-sm uppercase tracking-wide mb-1">Pourquoi ça marche</h5>
                    <p class="text-slate-600">${escapeHtml(action.effect)}</p>
                </div>`;
            }
            if (action.variations && action.variations.length > 0) {
                const items = action.variations.map((v, i) => `
                    <li class="flex items-start justify-between gap-3">
                        <span class="leading-relaxed ${v.isDone ? 'line-through text-slate-400' : ''}">${escapeHtml(v.text)}</span>
                        ${doneCheckbox(action.id, v.isDone, `toggleVariationDone(${action.id}, ${i})`)}
                    </li>`).join('');
                html += `
                <div>
                    <h5 class="font-semibold text-pink-600 text-sm uppercase tracking-wide mb-1">D'autres façons de faire (même intensité)</h5>
                    <ul class="space-y-3 text-slate-700">${items}</ul>
                </div>`;
            }

            modalContent.innerHTML = html;
            openModal();
        }

        /**
         * Hides the details modal.
         */
        function hideDetails() {
            closeModal();
            currentModalActionId = null;
        }

        // --- Modal focus management & keyboard/backdrop dismissal ---
        // Native <dialog> would give us this for free, but the modal predates
        // that choice and restyling it around <dialog> is out of scope here —
        // instead: remember what had focus before opening (so closing returns
        // it, e.g. to the card's "+" button), move focus into the modal on
        // open, close on Escape or a click on the backdrop (not the sheet
        // itself), and keep Tab cycling inside the modal while it's open.
        let modalReturnFocusEl = null;

        function getModalFocusable() {
            return Array.from(modal.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            )).filter(el => !el.disabled && el.offsetParent !== null);
        }

        function openModal() {
            modalReturnFocusEl = document.activeElement;
            modal.classList.remove('hidden');
            document.addEventListener('keydown', handleModalKeydown);
            // Focus the close button rather than the first focusable detail
            // control, so screen reader users land somewhere predictable.
            const closeBtn = modal.querySelector('header button');
            (closeBtn || modal).focus();
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.removeEventListener('keydown', handleModalKeydown);
            if (modalReturnFocusEl && typeof modalReturnFocusEl.focus === 'function') {
                modalReturnFocusEl.focus();
            }
            modalReturnFocusEl = null;
        }

        function handleModalKeydown(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                hideDetails();
                return;
            }
            if (e.key === 'Tab') {
                const focusable = getModalFocusable();
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        }

        // Click on the dimmed backdrop (not the sheet itself) closes the modal.
        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideDetails();
        });
    </script>
</body>
</html>

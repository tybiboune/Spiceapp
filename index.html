           green-600/amber-600 (not the lighter -400/-500 shades) so the
           white check/dash icon sitting on top still clears the 3:1
           non-text contrast minimum (the lighter shades put it around
           1.6-2.4:1, effectively invisible to low-vision users). */
        .done-checkbox:checked + label div {
            background-color: #16a34a; /* green-600, ~3.4:1 for the white icon */
            border-color: #16a34a;
        }
        .done-checkbox:checked + label div .check-icon {
            display: block;
        }
        /* Indeterminate = some but not all options in the group (original +
           variations) are done. Only ever set via JS (applyIndeterminateStates). */
        .done-checkbox:indeterminate + label div {
            background-color: #d97706; /* amber-600, ~3.2:1 for the white icon */
            border-color: #d97706;
        }
        .done-checkbox:indeterminate + label div .dash-icon {
            display: block;
        }
        /* The native checkbox itself is visually hidden (0×0, opacity 0) in
           favor of the styled <label> box next to it, but it stays in the
           tab order on purpose (keyboard users can Tab/Space it) — so its
           focus ring has to land on the visible label box instead of the
           invisible input. */
        .done-checkbox:focus-visible + label div {
            outline: 2px solid #4338ca; /* indigo-700, ~7:1 on white */
            outline-offset: 2px;
        }

        /* Consistent, high-contrast focus indicator for every other
           keyboard-focusable clickable element (buttons, tabs, links) that
           doesn't define its own focus style above. Native form controls
           (inputs/selects) get their own focus:ring-* utilities in markup
           instead, since :focus-visible here would double up with those. */
        button:focus-visible,
        [role="tab"]:focus-visible,
        a:focus-visible {
            outline: 2px solid #4338ca; /* indigo-700, ~7:1 on white */
            outline-offset: 2px;
        }

        /* Safe-area padding so content clears notches / gesture bars / the
           Android nav bar when installed as a standalone PWA. */
        body {
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        #surprise-fab {
            bottom: calc(1.25rem + env(safe-area-inset-bottom));
            right: calc(1.25rem + env(safe-area-inset-right));
        }
        #details-modal .modal-sheet {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Details modal: a bottom sheet that slides up on phones (thumb-
           reachable close button stays pinned at the top via its own
           sticky header), a centered dialog on larger screens. */
        @media (max-width: 639px) {
            #details-modal {

                padding: 0;
            }

                max-height: 92vh;
                width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                animation: sheet-up 0.25s ease-out;
            }
        }
        @keyframes sheet-up {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes update-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        }
        @media (prefers-reduced-motion: reduce) {
            .update-indeterminate-bar { animation: none; width: 100%; opacity: 0.6; }
        }

        /* Card hover-lift only where hovering is a real pointer gesture —

           leave the card visually "stuck" lifted/shadowed until the next

        @media (hover: hover) {

                transform: translateY(-4px);
            }

        @media (prefers-reduced-motion: reduce) {

                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

        // Literary filter

        const literaryFilterThumb = document.getElementById('literary-filter-thumb');
        const languageFilterBtn = document.getElementById('language-filter-btn');
        const languageFilterThumb = document.getElementById('language-filter-thumb');
        // Each is a 3-way cycle rather than a plain on/off: 'all' (both

        let literaryFilterMode = 'all'; // 'all' | 'literary' | 'standard'
        let languageFilterMode = 'all'; // 'all' | 'fr' | 'en'

        /**
         * Cards carry no explicit language field, so this detects it from
         * the text itself: French prose overwhelmingly contains at least
         * one accented character (é, à, ç, œ…), which plain English text
         * essentially never does — cheap and reliable enough for this corpus.
         */
        const FR_ACCENT_RE = /[àâäéèêëïîôöùûüçœ]/i;
        // Fallback for the rare card whose actionTitle+text happen to carry no
        // accent (e.g. legacy content typed without diacritics): French
        // function words that essentially never occur as English substrings.
        const FR_STOPWORD_RE = /\b(le|la|les|une?|des|est|avec|pour|dans|sur|que|qui|vous|tu|nous|cette|son|sa|ses|elle|toi|moi|aux)\b/i;
        function detectCardLanguage(action) {
            const sample = [
                action.actionTitle, action.text, action.effect, action.predictable,
                ...(action.variations || [])
            ].filter(Boolean).join(' ');
            if (FR_ACCENT_RE.test(sample)) return 'fr';
            if (FR_STOPWORD_RE.test(sample)) return 'fr';
            return 'en';
        }

        /**
         * "Mood search": typing a mundane phrase like "hello", "miss you" or
         * "comment ça va" surfaces the cards that are a more sophisticated,
         * literary way of saying exactly that — instead of only the cards
         * whose visible text happens to literally contain those words.
         *
         * How it works: hundreds of cards (the "Comically Tragic" and
         * "Poésie Dramatique" batches especially) were written with a
         * `predictable` field that explicitly names the boring phrase they
         * replace, e.g. predictable: "A plain 'miss you' text with no
         * imagery attached". Each category below pairs the phrases that
         * actually occur in that field (`predictableTerms`, used to CLASSIFY
         * cards) with a broader, synonym-friendly list of things a person
         * might actually type (`triggers`, used to RECOGNIZE the search
         * query) — so "salut"/"hello"/"hey"/"yo" all resolve to the same
         * `greeting` category and surface the same cards, in whichever
         * language the query was typed in.
         *
         * This is additive, not a replacement: renderActions() unions
         * mood-matched cards with the existing plain substring search, so a
         * literal keyword search never loses anything it used to find.
         */
        function normalizeForMoodMatch(text) {
            return (text || '')
                .toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g, '') // strip accents
                .replace(/[’‘]/g, "'")
                .replace(/[^a-z0-9' ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        const MOOD_CATEGORIES = [
            { id: 'greeting', predictableTerms: ['hey how are you', 'hello', 'hi', 'salut', 'bonjour', 'coucou', 'juste pour dire hi'],
              triggers: ['hello', 'hi', 'hey', 'yo', 'salut', 'coucou', 'bonjour', 'bonsoir', "what's up", 'whats up', 'wassup', 'quoi de neuf'] },
            { id: 'how_are_you', predictableTerms: ['how are you', "comment ca va", 'ca va'],
              triggers: ['how are you', "how's it going", 'hows it going', 'comment ca va', 'comment vas tu', 'ca va', 'tu vas bien'] },
            { id: 'miss_you', predictableTerms: ['miss you', 'tu me manques', 'pense a moi'],
              triggers: ['miss you', 'missing you', 'tu me manques', 'tu me manque'] },
            { id: 'thinking_of_you', predictableTerms: ['thinking of you', 'je pense a toi'],
              triggers: ['thinking of you', 'je pense a toi', 'penser a toi'] },
            { id: 'love_you', predictableTerms: ["i love you", "je t'aime"],
              triggers: ['i love you', 'love you', "je t'aime", 'je taime'] },
            { id: 'thanks', predictableTerms: ['thanks', 'thank you', 'merci'],
              triggers: ['thanks', 'thank you', 'merci'] },
            { id: 'sorry', predictableTerms: ['sorry', 'desole'],
              triggers: ['sorry', 'apologize', 'desole', 'desolee', 'pardon'] },
            { id: 'goodnight', predictableTerms: ['night love you', 'goodnight', 'bonne nuit'],
              triggers: ['goodnight', 'good night', 'night', 'bonne nuit'] },
            { id: 'good_morning', predictableTerms: ['good morning', 'bonjour'],
              triggers: ['good morning', 'morning', 'bonjour'] },
            { id: 'good_day', predictableTerms: ['have a good day', 'bonne journee', 'passe une bonne journee'],
              triggers: ['have a good day', 'good day', 'bonne journee'] },
            { id: 'proud', predictableTerms: ['proud of you', 'je suis fier', 'fier de toi', 'fiere de toi'],
              triggers: ['proud of you', 'proud', 'fier de toi', 'fiere de toi'] },
            { id: 'well_done', predictableTerms: ['well done', 'bravo', 'congrats', 'felicitations', 'bien joue', 'nice job'],
              triggers: ['well done', 'good job', 'nice job', 'congrats', 'congratulations', 'bravo', 'felicitations', 'bien joue'] },
            { id: 'good_luck', predictableTerms: ['good luck', 'bon courage'],
              triggers: ['good luck', 'bon courage', 'break a leg'] },
            { id: 'take_care', predictableTerms: ['take care', 'prends soin de toi'],
              triggers: ['take care', 'prends soin de toi'] },
            { id: 'see_you_tonight', predictableTerms: ['see you tonight', 'a ce soir'],
              triggers: ['see you tonight', 'see you later', 'a ce soir', 'a plus tard', 'a toute'] },
            { id: 'cant_wait', predictableTerms: ["can't wait", 'ai hate de te voir', "j'ai hate"],
              triggers: ["can't wait", 'cant wait', 'hate de te voir', "j'ai hate", 'hate de te voir'] },
            { id: 'safe_travels', predictableTerms: ['drive safe', 'get home safe', 'roule prudemment', 'rentre bien', 'safe travels'],
              triggers: ['drive safe', 'get home safe', 'safe travels', 'roule prudemment', 'rentre bien', 'bon retour', 'bon voyage'] },
            { id: 'running_late', predictableTerms: ['running late', 'je suis en retard', 'en retard'],
              triggers: ['running late', "i'm late", 'im late', 'je suis en retard', 'en retard'] },
            { id: 'compliment', predictableTerms: ['you looked great today', 'tu es belle', 'tu etais belle', 'tu es la meilleure'],
              triggers: ['you look great', 'you look beautiful', 'tu es belle', 'tu es beau', "t'es belle"] },
            { id: 'meet_up', predictableTerms: ['when should we meet up', "quand est ce qu'on se voit"],
              triggers: ['when are we meeting', 'quand se voit on', "quand est ce qu'on se voit", 'quand on se voit'] },
            { id: 'rest', predictableTerms: ['sleep in if you can', 'fais la grasse matinee'],
              triggers: ['sleep in', 'fais la grasse matinee', 'repose toi'] },
        ];

        /**
         * Returns the ids of every mood category the typed query resolves
         * to. A query matches a category if it's a substring of (or
         * contains) any of that category's trigger phrases — loose enough
         * to catch partial typing ("hell" while typing "hello") without
         * requiring an exact match.
         */
        function detectMoodCategories(query) {
            const q = normalizeForMoodMatch(query);
            if (!q) return [];
            const matched = [];
            for (const category of MOOD_CATEGORIES) {
                const hit = category.triggers.some(t => t.startsWith(q) || containsWholeTerm(q, t));
                if (hit) matched.push(category.id);
            }
            return matched;
        }

        // Extracts ONLY the specific mundane phrase a card's `predictable`
        // field names as what it replaces (e.g. the 'miss you' out of "A
        // plain 'miss you' text with no imagery attached"), rather than
        // matching against the whole sentence. This matters: plenty of
        // older/base cards share one long, generic `predictable` paragraph
        // across a whole group of unrelated alternatives (e.g. one shared
        // "instead of the usual 'hey, how are you' / 'thinking of you'..."
        // block covering five very different specific action cards) — matching
        // against the full text would make nearly all of them look like
        // greeting/check-in cards regardless of what they actually are.
        // Cards without this specific single-quoted-phrase convention
        // (predictablePhrase stays null) simply never participate in mood
        // search, which is correct — they were never written as "the
        // sophisticated version of saying exactly X".
        const PREDICTABLE_PHRASE_RE = /(?:plain|simple)\s+['’‘](.+?)['’‘]\s*(?=text|note|sans|avec|\.|$)/i;
        function extractPredictablePhrase(action) {
            if (action._predictablePhrase === undefined) {
                const m = PREDICTABLE_PHRASE_RE.exec(action.predictable || '');
                action._predictablePhrase = m ? normalizeForMoodMatch(m[1]) : null;
            }
            return action._predictablePhrase;
        }

        // Plain .includes() substring matching lets a short term like "hi"
        // false-positive inside unrelated words (e.g. "thinking" contains
        // "hi"), so terms are matched as whole words/phrases instead.
        function containsWholeTerm(haystack, term) {
            const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return new RegExp(`\\b${escaped}\\b`).test(haystack);
        }

        function cardMatchesMoodCategory(action, categoryId) {
            const category = MOOD_CATEGORIES.find(c => c.id === categoryId);
            if (!category) return false;
            const phrase = extractPredictablePhrase(action);
            if (!phrase) return false;
            return category.predictableTerms.some(term => containsWholeTerm(phrase, term));
        }

        // Cycle mode controls
        const cycleBarEl = document.getElementById('cycle-bar');
        const cycleToggleBtn = document.getElementById('cycle-toggle-btn');
        const cycleToggleState = document.getElementById('cycle-toggle-state');
        const cyclePhaseBadge = document.getElementById('cycle-phase-badge');
        const cycleDateRow = document.getElementById('cycle-date-row');
        const cycleLastPeriodInput = document.getElementById('cycle-last-period');
        const cycleNoDateHint = document.getElementById('cycle-no-date-hint');

        // Shared HTML-escaping helpers — text content and attribute values
        // need slightly different escaping (attributes also need quotes
        // escaped so injected text can't break out of the surrounding ""),
        // used wherever server content is interpolated into a template
        // string rather than set via .textContent.
        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
        const escapeAttr = escapeHtml;

        let allActions = [];
        const ACTIONS_CACHE_KEY = 'spiceapp_actions_cache_v1';
        let currentModalActionId = null; // which action's details modal is open, if any
        let currentCategory = 'ACTIONS'; // ACTIONS | SMS | POSTITS
        let currentFilters = {
            status: 'all',
            drama: 0,
            sexual: 0,
            theme: 'all',
            search: ''
        };
        let currentSort = 'default';

        // --- Cycle Mode ---
        // Standard 28-day cycle broken into 5 phases (day 1 = first day of
        // period). Each phase carries the "drama"/sexual intensity range and
        // theme keywords (FR + EN, since the corpus was written in mixed
        // batches) that correlate psychologically/energetically/sexually
        // with it, used to filter which cards are shown when cycle mode is on.
        const CYCLE_LENGTH = 28;
        const CYCLE_PHASES = [
            {
                key: 'menstrual', label: 'Règles', range: [1, 5],
                dramaRange: [1, 3], sexualRange: [1, 2],
                boost: ['care', 'comfort', 'confort', 'tenderness', 'tendresse', 'douceur', 'rest', 'repos',
                        'bienveillance', 'patience', 'écoute', 'ecoute', 'introspection', 'cocooning']
            },
            {
                key: 'follicular', label: 'Folliculaire', range: [6, 11],
                dramaRange: [2, 4], sexualRange: [2, 4],
                boost: ['adventure', 'aventure', 'spontaneity', 'spontanéité', 'playful', 'ludique',
                        'discovery', 'découverte', 'confidence', 'confiance', 'energy', 'énergie',
                        'curiosity', 'curiosité', 'nouveauté', 'novelty']
            },
            {
                key: 'ovulation', label: 'Ovulation', range: [12, 16],
                dramaRange: [3, 5], sexualRange: [3, 5],
                boost: ['desire', 'désir', 'passion', 'physical', 'physique', 'primal', 'confidence',
                        'confiance', 'flirty', 'séduction', 'seduction', 'sensory', 'sensorialité',
                        'dominance', 'power dynamics', 'erotic', 'érotique', 'intensité', 'intensity']
            },
            {
                key: 'luteal_early', label: 'Lutéale', range: [17, 23],
                dramaRange: [1, 3], sexualRange: [1, 3],
                boost: ['focus', 'nesting', 'routine', 'care', 'connection', 'connexion', 'rituel',
                        'ritual', 'constance', 'préparation', 'preparation', 'fidélité', 'loyauté']
            },
            {
                key: 'luteal_late', label: 'Prémenstruel', range: [24, 28],
                dramaRange: [1, 2], sexualRange: [1, 2],
                boost: ['bienveillance', 'patience', 'care', 'reassurance', 'réassurance', 'comfort',
                        'confort', 'écoute', 'ecoute', 'douceur', 'vulnerability', 'vulnérabilité',
                        'honnêteté', 'honesty']
            }
        ];

        let cycleSettings = { cycleEnabled: false, lastPeriodDate: null };

        /**
         * Real elapsed day count since the last logged period, 1-indexed —
         * NOT wrapped to 1..CYCLE_LENGTH. Wrapping unconditionally (e.g. via
         * a modulo) would silently declare a brand-new period every 28 days
         * even when none was actually logged, which is wrong and misleading
         * (a cycle running to day 29 would show as "Règles jour 2").
         */
        function getCycleDay(lastPeriodDate) {
            const start = new Date(lastPeriodDate + 'T00:00:00');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffDays = Math.floor((today - start) / 86400000);
            return diffDays + 1;
        }

        /**
         * Which phase(s) are "active" for a given real cycle day. Normally
         * just one, but within 1 day of a phase boundary inside the modeled
         * 28-day window (the "période charnière" between two phases,
         * including the natural day 28 → day 1 handoff into a new period)
         * both neighboring phases are included, so the shown cards blend
         * rather than snapping abruptly. Once the real day count runs past
         * CYCLE_LENGTH with no new period logged, this stops wrapping back
         * to "Règles" (that would fabricate a period that was never
         * confirmed) and instead stays on the last modeled phase.
         */
        function getActivePhases(cycleDay) {
            if (cycleDay > CYCLE_LENGTH) {
                return [CYCLE_PHASES[CYCLE_PHASES.length - 1]];
            }
            const lookupDay = Math.max(cycleDay, 1);
            const pad = 1;
            return CYCLE_PHASES.filter(phase => {
                for (let d = phase.range[0] - pad; d <= phase.range[1] + pad; d++) {
                    const normalized = ((d - 1) % CYCLE_LENGTH + CYCLE_LENGTH) % CYCLE_LENGTH + 1;
                    if (normalized === lookupDay) return true;
                }
                return false;
            });
        }

        function cardMatchesPhase(action, phase) {
            const themesLower = (action.themes || []).map(t => String(t).toLowerCase());
            const boostHit = phase.boost.some(kw => themesLower.some(t => t.includes(kw)));
            if (boostHit) return true;
            return action.dramaIntensity >= phase.dramaRange[0] && action.dramaIntensity <= phase.dramaRange[1] &&
                   action.sexualIntensity >= phase.sexualRange[0] && action.sexualIntensity <= phase.sexualRange[1];
        }

        function cardMatchesActivePhases(action, activePhases) {
            return activePhases.some(phase => cardMatchesPhase(action, phase));
        }

        /**
         * Reads the settings persisted server-side (database.db), the same
         * place done-progress lives, so cycle mode + last period date
         * survive closing the app.
         */
        async function loadCycleSettings() {
            try {
                const response = await fetch('/api/settings');
                if (!response.ok) return;
                cycleSettings = await response.json();
            } catch (e) {
                // Server unreachable — cycle mode just stays off/unset locally.
            } finally {
                renderCycleUI();
                // This resolves independently of loadActionsFromServer's own
                // fetch (both start on DOMContentLoaded) — if a returning
                // user has cycle mode already enabled server-side and this
                // settles AFTER the cards were first rendered, the card list
                // and theme list would otherwise silently stay on the
                // cycle-disabled default until some unrelated interaction
                // happened to re-render them. Safe to call unconditionally
                // even if allActions hasn't loaded yet (just re-run once it has).
                setupDashboard();
                renderActions();
            }
        }

        // Bumped on every persistCycleSettings() call so a response that
        // resolves out of order (e.g. the user taps the toggle twice in a
        // row on a slow connection) can't overwrite the UI with stale data
        // once a newer request has already landed — this is what could make
        // the cycle toggle appear to silently revert.
        let cycleSettingsRequestId = 0;

        /**
         * Persists a settings change to the server in the background.
         * Deliberately NOT awaited by callers before rendering: all the data
         * needed to filter/render is already in memory (allActions), so
         * there's nothing to stream or wait on locally — the only actual
         * latency was this network round-trip blocking the UI update.
         * Rendering optimistically first, and only reconciling from the
         * server's response (or rolling back) once it lands, is what makes
         * the toggle feel instant.
         */
        async function persistCycleSettings(partial) {
            const requestId = ++cycleSettingsRequestId;
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(partial)
                });
                // A newer call already started (and will reconcile on its
                // own) — applying this older response now would revert
                // whatever the user did since.
                if (requestId !== cycleSettingsRequestId) return;
                // Reconcile with whatever the server actually stored. On
                // failure, just keep the optimistic value the caller already
                // applied and rendered — nothing to roll back to, since we
                // never had a separate "confirmed" copy to fall back on.
                if (response.ok) {
                    cycleSettings = await response.json();
                    renderCycleUI();
                    renderActions();
                }
            } catch (e) {
                // Offline/unreachable — optimistic local state stands as-is.
            }
        }

        /**
         * The Filters panel below sticks right under the mode bar (Cycle +
         * Literary + Language), the same way it already sticks under itself
         * — but the mode bar's height isn't fixed (the cycle phase badge,
         * date row and "no date" hint each add/remove a line), so its
         * sticky `top` is computed here instead of a fixed Tailwind class,
         * recomputed whenever the mode bar's content changes.
         */
        function updateStickyOffsets() {
            const filtersPanel = document.getElementById('filters-panel');
            if (!cycleBarEl || !filtersPanel) return;
            const isDesktop = window.matchMedia('(min-width: 640px)').matches;
            const barTop = isDesktop ? 16 : 8; // matches cycle-bar's own top-4/top-2
            const gap = isDesktop ? 16 : 8; // matches the panel's previous top-4/top-2, reused as the gap between the two bars
            filtersPanel.style.top = `${barTop + cycleBarEl.offsetHeight + gap}px`;
        }
        window.addEventListener('resize', updateStickyOffsets);

        function renderCycleUI() {
            const enabled = !!cycleSettings.cycleEnabled;
            cycleToggleBtn.setAttribute('aria-checked', enabled ? 'true' : 'false');
            cycleToggleState.textContent = enabled ? 'activé' : 'désactivé';
            cycleToggleBtn.classList.toggle('bg-purple-600', enabled);
            cycleToggleBtn.classList.toggle('text-white', enabled);
            cycleToggleBtn.classList.toggle('border', !enabled);
            cycleToggleBtn.classList.toggle('border-slate-500', !enabled);
            cycleToggleBtn.classList.toggle('bg-white', !enabled);
            cycleToggleBtn.classList.toggle('text-slate-600', !enabled);

            cycleDateRow.style.display = enabled ? 'flex' : 'none';
            cycleLastPeriodInput.value = cycleSettings.lastPeriodDate || '';

            const hasDate = enabled && !!cycleSettings.lastPeriodDate;
            cycleNoDateHint.classList.toggle('hidden', !enabled || hasDate);

            if (hasDate) {
                const cycleDay = getCycleDay(cycleSettings.lastPeriodDate);
                const activePhases = getActivePhases(cycleDay);
                const label = activePhases.map(p => p.label).join(' → ');
                const overdueNote = cycleDay > CYCLE_LENGTH ? ' — cycle plus long que d\'habitude, pense à mettre la date à jour dès tes prochaines règles' : '';
                cyclePhaseBadge.textContent = `${label} (jour ${cycleDay})${overdueNote}`;
                cyclePhaseBadge.classList.remove('hidden');
            } else {
                cyclePhaseBadge.classList.add('hidden');
            }
            updateStickyOffsets();
        }

        cycleToggleBtn.addEventListener('click', () => {
            cycleSettings.cycleEnabled = !cycleSettings.cycleEnabled;
            const payload = { cycleEnabled: cycleSettings.cycleEnabled };
            // Turning it on with no date yet on file would otherwise filter
            // nothing (silently showing everything, indistinguishable from
            // being off) — default to today so the toggle visibly does
            // something right away; the user can correct the date after.
            if (cycleSettings.cycleEnabled && !cycleSettings.lastPeriodDate) {
                cycleSettings.lastPeriodDate = new Date().toISOString().slice(0, 10);
                payload.lastPeriodDate = cycleSettings.lastPeriodDate;
            }
            // Render straight away from the already-in-memory data — the
            // network save happens after, in the background, so the toggle
            // never waits on a round-trip to feel responsive.
            renderCycleUI();
            setupDashboard();
            renderActions();
            persistCycleSettings(payload);
        });
        // 'input' (not just 'change') so a date picked via click-through on
        // the native widget is saved immediately rather than only on blur —
        // for type="date", .value is only ever empty or a complete valid
        // date, so this can't save a garbage partial value.
        cycleLastPeriodInput.addEventListener('input', (e) => {
            cycleSettings.lastPeriodDate = e.target.value || null;
            renderCycleUI();
            setupDashboard();
            renderActions();
            persistCycleSettings({ lastPeriodDate: cycleSettings.lastPeriodDate });
        });

        /**
         * "Literary" is a main, always-visible filter (separate from the

         * looking like the switch is off. Remembered per-device.
         */
        const LITERARY_FILTER_STORAGE_KEY = 'spiceapp_literary_filter_mode_v1';
        const LITERARY_FILTER_MODES = ['all', 'literary', 'standard'];
        const LITERARY_FILTER_LABELS = { all: 'ALL', literary: '📚', standard: '📄' };
        const LITERARY_FILTER_ARIA = {
            all: 'Filtre littéraire : toutes les cartes (littéraires + standards)',
            literary: 'Filtre littéraire : cartes littéraires uniquement',
            standard: 'Filtre littéraire : cartes standards uniquement (sans les littéraires)',
        };

        function renderLiteraryFilterUI() {
            const index = LITERARY_FILTER_MODES.indexOf(literaryFilterMode);
            literaryFilterBtn.setAttribute('aria-pressed', literaryFilterMode !== 'all' ? 'true' : 'false');
            literaryFilterBtn.setAttribute('aria-label', LITERARY_FILTER_ARIA[literaryFilterMode]);
            literaryFilterBtn.classList.toggle('bg-indigo-600', literaryFilterMode === 'literary');
            literaryFilterBtn.classList.toggle('bg-purple-600', literaryFilterMode === 'standard');
            literaryFilterBtn.classList.toggle('bg-slate-300', literaryFilterMode === 'all');
            // 3 fixed thumb positions across the same track width used by the 2-state design.
            literaryFilterThumb.classList.remove('translate-x-0', 'translate-x-4', 'translate-x-8');
            literaryFilterThumb.classList.add(['translate-x-0', 'translate-x-4', 'translate-x-8'][index]);
